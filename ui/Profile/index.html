
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Hoot</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../UIFONT/web/inter.css">
</head>
<body>
    <main>
        <section class="main-profile">

      <div class="upperbody">
            <div class="banner">
            <img src="king.webp">
              </div>

            <div class="profile-content">
              <div class="avatar">
                <img
                    src="horse.webp"
                    alt="Profile picture">
              </div>

              <div class="display-name">
                <h1>Abdi</h1>
              </div>
                
              <div class="username">
                <p>@Abdi@hoot.sdu.dk</p>
              </div>

                <div class="bio">
                <p class="bio">
                  Hey there lol
                </p>

                 </div>

                <div class="location">
                <p>Odense, dk</p>
                </div>
            
          </div>

                <div class="profile-stats">
                  <div class="hoots-stat">
                    <span><strong>1</strong> Hoots</span>
                  </div>

                  <div class="following-stat">
                    <span><strong>0</strong> Following</span>
                  </div>

                  <div class="followers-stat">                
                    <span><strong>0</strong> Followers</span>   
                  </div>

                </div>
      </div>
        </section>
      <section class="feed">
        <div class="Hoots">
          <div class="top-bar">
            <p><strong>Hoots</strong></p>
          </div>
          <div class="Hoot-content">
          <div class="hoot-avatar">
                <img
                    src="horse.webp"
                    alt="Profile picture">
          </div>
            <div class="hoot-display-name">
              <p><strong>Abdi</strong></p>
              </div>
              <div class="hoot-username">
              <p>@Abdi@hoot.sdu.dk</p>

            </div>
            <div class="hoot-text">
            <p>Hello from SDU:)</p>
              </div>
          </div>
        </div>

      </section>
    </main>
</body>
</html>
