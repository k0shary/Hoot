<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Hoot</title>

    <link rel="stylesheet" href="/Profile/style.css">
    <link rel="stylesheet" href="/UIFONT/web/inter.css">
</head>
<body>
    <main>
        <section class="upper-bar">   
        <div class="nav-bar">
            </div>

            <div class="search-bar">
              <label for="search"></label>
              <input type="text" placeholder="Search" id="upper-bar-search">
            </div>
        </section>

        <section class="main-profile">

      <div class="upperbody">
            <div class="banner">
            <img src="_cover_url_">
              </div>

            <div class="profile-content">
              <div class="avatar">
                <img
                    src="_avatar_url_"
                    alt="Profile picture">
              </div>

              <div class="display-name">
                <h1>_display_name_</h1>
              </div>
                
              <div class="username">
                <p>@_username_@hoot.sdu.dk</p>
              </div>

                <div class="bio">
                <p class="bio">
                _bio_
                </p>

                 </div>

                <div class="location">
                <p>Odense, dk</p>
                </div>
            
          </div>

                <div class="profile-stats">
                  <div class="hoots-stat">
                    <span><strong>1</strong> Hoots</span>
                  </div>

                  <div class="following-stat">
                    <span><strong>0</strong> Following</span>
                  </div>

                  <div class="followers-stat">                
                    <span><strong>0</strong> Followers</span>   
                  </div>

                </div>
      </div>
        </section>
      <section class="feed">
        <div class="Hoots">
          <div class="top-bar">
            <p><strong>Hoots</strong></p>
          </div>
          <div class="Hoot-content">
          <div class="hoot-avatar">
                <img
                    src="_avatar_url_"
                    alt="Profile picture">
          </div>
            <div class="hoot-display-name">
              <p><strong>_display_name_</strong></p>
              </div>
              <div class="hoot-username">
              <p>@_username_@hoot.sdu.dk</p>

            </div>
            <div class="hoot-text">
            <p>_posts_feed_</p>
              </div>
          </div>
        </div>

      </section>
    </main>
</body>
</html>
