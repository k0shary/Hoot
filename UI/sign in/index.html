<!DOCTYPE html>
<html lang= "en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hoot</title>
    <link rel="stylesheet" href="style.css">
</head>
  <body>
    <main>
      <section>
        <div class="main-form">


            <div class="input-group">
            <h5 class="title">Login</h5>
            <form action="">

              <label for="username"></label>
              <input type="text" placeholder="Username" id="login-username">
            
              <label for="password"></label>
              <input type="password" placeholder="Password" id="login-password">
          </form>

            <button class="sign-in">Sign in</button>

          <label class="remember">
            <input type="checkbox" value="1" name="remember_me" tabindex="3">
            <span>Remember me</span>
          </label>


            <p class="Forget"><a href="#">Forgot your password?</a></p>
            </div>

            <div class="new-group">
            <h5 class="title">New to Hoot? Sign up</h5>
            <form action="">

              <label for="email"></label>
              <input type="text" placeholder="Email" id="sign-up-email">

              <label for="username"></label>
              <input type="text" placeholder="Username" id="sign-up-username">
            
              <label for="password"></label>
              <input type="password" placeholder="Password" id="sign-up-password">
          </form>

          <button class="sign-up">Sign up</button>
          
        </div>
      </section>
    </main>
    
  </body>
</html>
