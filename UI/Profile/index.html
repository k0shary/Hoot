
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Hoot</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../UIFONT/web/inter.css">
</head>
<body>
    <main>
        <section class="main-profile">

      <div class="upperbody">
            <div class="banner">
            <img src="muse.jpg">
              </div>

            <div class="profile-content">
              <div class="avatar">
                <img
                    src="horse.jpeg"
                    alt="Profile picture">
              </div>

              <div class="display-name">
                <h1>Pizma</h1>
              </div>
                
              <div class="username">
                <p>@Pizma@hoot.sdu.dk</p>
              </div>

                <div class="bio">
                <p class="bio">
                  Hey there lol
                </p>

                 </div>

                <div class="location">
                <p>Odense, dk</p>
                </div>
            
          </div>

                <div class="profile-stats">
                  <div class="hoots-stat">
                    <span><strong>12</strong> Hoots</span>
                  </div>

                  <div class="following-stat">
                    <span><strong>48</strong> Following</span>
                  </div>

                  <div class="followers-stat">                
                    <span><strong>120</strong> Followers</span>   
                  </div>

                </div>
      </div>
        </section>
    </main>
